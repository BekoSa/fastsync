<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FastSync Link Console</title>
  <style>
    :root {
      --ink: #e8eadf;
      --muted: #8e978f;
      --dim: #626a65;
      --panel: #111714;
      --panel-2: #161d19;
      --line: #2a342e;
      --line-hot: #506358;
      --green: #9ef01a;
      --green-soft: #5b8d15;
      --amber: #ffb547;
      --red: #ff665c;
      --cyan: #65d6d0;
      --page: #090d0b;
      --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--page); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(158, 240, 26, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(158, 240, 26, .025) 1px, transparent 1px),
        radial-gradient(circle at 78% -10%, rgba(101, 214, 208, .12), transparent 34rem),
        var(--page);
      background-size: 32px 32px, 32px 32px, auto, auto;
      font-family: var(--sans);
      line-height: 1.45;
    }

    button, input, select { font: inherit; }

    button, input, select {
      color: var(--ink);
      border: 1px solid var(--line);
      background: #0c110e;
      border-radius: 2px;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    button {
      min-height: 38px;
      padding: 0 14px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }

    button:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
    button:disabled { cursor: not-allowed; opacity: .4; }
    button.primary { color: #071004; border-color: var(--green); background: var(--green); }
    button.primary:hover:not(:disabled) { color: #071004; background: #b4ff42; }
    button.danger:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
    button.quiet { min-height: 30px; padding-inline: 9px; }

    input, select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
    }

    input::placeholder { color: #58605b; }

    label, legend {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }

    .shell { width: min(1600px, 100%); margin: 0 auto; padding: 24px; }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 20px;
      padding: 8px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .brandline { display: flex; align-items: center; gap: 14px; }

    .mark {
      position: relative;
      width: 38px;
      height: 38px;
      border: 1px solid var(--green);
      background: linear-gradient(135deg, transparent 45%, var(--green) 46% 53%, transparent 54%);
      clip-path: polygon(0 0, 100% 0, 100% 73%, 73% 100%, 0 100%);
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid var(--green-soft);
    }

    h1 { margin: 0; font-family: var(--mono); font-size: clamp(21px, 3vw, 34px); letter-spacing: -.045em; }
    h1 span { color: var(--green); }
    .kicker { margin: 3px 0 0; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }

    .link-state {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .signal { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(255,181,71,.1); }
    .signal.live { background: var(--green); box-shadow: 0 0 0 4px rgba(158,240,26,.1), 0 0 16px rgba(158,240,26,.45); }

    .identity-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(3, minmax(130px, .7fr));
      gap: 1px;
      margin: 16px 0;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .identity-cell { min-width: 0; padding: 14px 16px; background: var(--panel); }
    .identity-cell:first-child { border-left: 3px solid var(--green); }
    .micro { display: block; margin-bottom: 5px; color: var(--dim); font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .identity-value { overflow: hidden; color: var(--ink); font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .identity-name { font-family: var(--sans); font-size: 18px; font-weight: 700; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .column { display: grid; gap: 16px; min-width: 0; }

    .panel {
      position: relative;
      min-width: 0;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.018), transparent 34%), var(--panel);
    }

    .panel::before {
      content: "";
      position: absolute;
      top: -1px;
      right: -1px;
      width: 18px;
      height: 18px;
      border-top: 1px solid var(--green-soft);
      border-right: 1px solid var(--green-soft);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .09em; text-transform: uppercase; }
    .counter { color: var(--green); font-family: var(--mono); font-size: 11px; }
    .panel-body { padding: 14px; }

    .manual-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 14px; }
    .manual-form label { grid-column: 1 / -1; }

    .device-list { display: grid; gap: 8px; }

    .device {
      padding: 12px;
      border: 1px solid var(--line);
      background: #0d120f;
    }

    .device-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .device-title { min-width: 0; }
    .device-name { overflow: hidden; margin: 0; font-size: 14px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .device-address { margin-top: 3px; color: var(--muted); font-family: var(--mono); font-size: 10px; word-break: break-all; }
    .device-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .device-actions { display: flex; gap: 6px; margin-top: 10px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 21px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.online, .badge.trusted { color: var(--green); border-color: rgba(158,240,26,.28); }
    .badge.pending { color: var(--amber); border-color: rgba(255,181,71,.3); }
    .badge.offline { color: var(--dim); }
    .badge.failed, .badge.cancelled, .badge.completed_with_errors { color: var(--red); border-color: rgba(255,102,92,.3); }
    .badge.transferring, .badge.scanning, .badge.verifying { color: var(--cyan); border-color: rgba(101,214,208,.3); }
    .badge.completed { color: var(--green); border-color: rgba(158,240,26,.28); }
    .badge.paused, .badge.interrupted { color: var(--amber); border-color: rgba(255,181,71,.3); }

    .empty { padding: 24px 10px; color: var(--muted); font-family: var(--mono); font-size: 11px; text-align: center; }

    .transfer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; padding: 1px; border: 1px solid var(--line); background: var(--line); }
    .mode-switch label { position: relative; cursor: pointer; }
    .mode-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .mode-switch span { display: block; padding: 10px; color: var(--muted); background: #0c110e; text-align: center; }
    .mode-switch input:checked + span { color: #091006; background: var(--green); }
    .mode-switch input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: -2px; }
    .launch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; grid-column: 1 / -1; padding-top: 4px; }
    .launch-note { color: var(--dim); font-family: var(--mono); font-size: 9px; text-transform: uppercase; }

    .jobs { display: grid; gap: 10px; }

    .job {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0d120f;
    }

    .job::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 2px;
      background: var(--green-soft);
    }

    .job-main { padding: 14px; }
    .job-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
    .job-route { overflow: hidden; margin: 0; font-family: var(--mono); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .job-route strong { color: var(--cyan); font-weight: 500; }
    .job-id { margin-top: 4px; color: var(--dim); font-family: var(--mono); font-size: 9px; }

    .progress-track { height: 6px; margin: 14px 0 7px; overflow: hidden; background: #202923; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green-soft), var(--green)); box-shadow: 0 0 12px rgba(158,240,26,.28); transition: width .3s ease; }
    .progress-caption { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .progress-caption strong { color: var(--ink); }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 1px;
      margin-top: 13px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .metric { min-width: 0; padding: 9px; background: var(--panel-2); }
    .metric-value { overflow: hidden; color: var(--ink); font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .metric-label { margin-top: 3px; color: var(--dim); font-family: var(--mono); font-size: 8px; letter-spacing: .06em; text-transform: uppercase; }
    .metric.hot .metric-value { color: var(--green); }

    .pipeline {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      text-transform: uppercase;
    }

    .pipeline b { color: var(--cyan); font-weight: 600; }
    .current-file { overflow: hidden; flex: 1 1 240px; text-overflow: ellipsis; white-space: nowrap; }
    .job-footer { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); background: rgba(255,255,255,.012); }
    .job-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .job-time { align-self: center; color: var(--dim); font-family: var(--mono); font-size: 9px; }

    details.errors { margin-top: 10px; border-top: 1px solid rgba(255,102,92,.22); }
    details.errors summary { padding: 9px 0 2px; color: var(--red); cursor: pointer; font-family: var(--mono); font-size: 10px; }
    .error-list { margin: 7px 0 0; padding: 0; list-style: none; }
    .error-list li { padding: 7px 9px; border-left: 2px solid var(--red); color: #d8aaa6; background: rgba(255,102,92,.055); font-family: var(--mono); font-size: 9px; word-break: break-word; }
    .error-list li + li { margin-top: 5px; }

    .toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 10; display: grid; width: min(380px, calc(100vw - 36px)); gap: 8px; }
    .toast { padding: 12px 14px; border: 1px solid var(--red); color: #ffd0cc; background: #22110f; box-shadow: 0 12px 36px rgba(0,0,0,.4); font-size: 12px; }
    .toast.ok { border-color: var(--green-soft); color: var(--ink); background: #111a0d; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 1080px) {
      .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .identity-strip { grid-template-columns: 1.4fr 1fr 1fr; }
      .identity-cell:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 820px) {
      .shell { padding: 16px; }
      .workspace { grid-template-columns: 1fr; }
      .identity-strip { grid-template-columns: 1fr 1fr; }
      .identity-cell:last-child { grid-column: auto; }
      .device-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 580px) {
      .shell { padding: 10px; }
      .topbar { align-items: start; }
      .link-state { justify-self: end; }
      .identity-strip, .transfer-grid { grid-template-columns: 1fr; }
      .identity-cell:last-child, .field.wide, .launch-row { grid-column: 1; }
      .device-list { grid-template-columns: 1fr; }
      .manual-form { grid-template-columns: 1fr; }
      .manual-form label { grid-column: 1; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .job-head { grid-template-columns: 1fr; }
      .job-head .badge { justify-self: start; }
      .job-footer, .launch-row { align-items: stretch; flex-direction: column; }
      .launch-row button { width: 100%; }
      .job-time { align-self: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="brandline">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <h1>FAST<span>SYNC</span> // LINK CONSOLE</h1>
            <p class="kicker">Authenticated transfer control plane</p>
          </div>
        </div>
      </div>
      <div class="link-state" title="Live event connection">
        <span id="signal" class="signal" aria-hidden="true"></span>
        <span id="socket-label">linking</span>
      </div>
    </header>

    <section id="identity" class="identity-strip" aria-label="Local device identity">
      <div class="identity-cell"><span class="micro">Local node</span><div class="identity-value">Loading identity...</div></div>
    </section>

    <div class="workspace">
      <aside class="column">
        <section class="panel" aria-labelledby="devices-title">
          <div class="panel-head">
            <h2 id="devices-title" class="panel-title">Peer Registry</h2>
            <span id="device-count" class="counter">00</span>
          </div>
          <div class="panel-body">
            <form id="connect-form" class="manual-form">
              <label for="manual-address">Manual QUIC endpoint</label>
              <input id="manual-address" name="address" inputmode="url" autocomplete="off" placeholder="192.168.1.20:39463" required>
              <button type="submit">Probe</button>
            </form>
            <div id="devices" class="device-list"><div class="empty">Scanning local links...</div></div>
          </div>
        </section>
      </aside>

      <div class="column">
        <section class="panel" aria-labelledby="transfer-title">
          <div class="panel-head">
            <h2 id="transfer-title" class="panel-title">Transfer Dispatch</h2>
            <span class="counter">TX / V1</span>
          </div>
          <div class="panel-body">
            <form id="transfer-form" class="transfer-grid">
              <div class="field wide">
                <label for="source-path">Local source directory</label>
                <input id="source-path" name="source_path" autocomplete="off" placeholder="D:\SteamLibrary\steamapps\common\Game" required>
              </div>
              <div class="field wide">
                <label for="peer-id">Remote trusted device</label>
                <select id="peer-id" name="peer_id" required><option value="">No trusted peers</option></select>
              </div>
              <div class="field wide">
                <label for="destination-path">Remote destination directory</label>
                <input id="destination-path" name="destination_path" autocomplete="off" placeholder="D:\Games\Game" required>
              </div>
              <fieldset class="field">
                <legend>Verification</legend>
                <div class="mode-switch">
                  <label><input type="radio" name="verification" value="fast"><span>Fast</span></label>
                  <label><input type="radio" name="verification" value="verified" checked><span>Verified</span></label>
                </div>
              </fieldset>
              <div class="field">
                <label for="concurrency">Concurrency</label>
                <input id="concurrency" name="concurrency" type="number" min="1" max="64" value="32" required>
              </div>
              <div class="field">
                <label for="chunk-size">Chunk size (MiB)</label>
                <input id="chunk-size" name="chunk_size_mib" type="number" min="1" max="1024" value="4" required>
              </div>
              <div class="launch-row">
                <span class="launch-note">Source stays local. Destination is interpreted by the peer.</span>
                <button id="start-transfer" class="primary" type="submit">Start Transfer</button>
              </div>
            </form>
          </div>
        </section>

        <section class="panel" aria-labelledby="jobs-title">
          <div class="panel-head">
            <h2 id="jobs-title" class="panel-title">Transfer Ledger</h2>
            <span id="job-count" class="counter">00</span>
          </div>
          <div class="panel-body">
            <div id="jobs" class="jobs"><div class="empty">No transfer records.</div></div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script>
    "use strict";

    const app = {
      local: null,
      devices: [],
      jobs: [],
      socket: null,
      reconnectDelay: 800,
      refreshTimer: null
    };

    const identityEl = document.getElementById("identity");
    const devicesEl = document.getElementById("devices");
    const jobsEl = document.getElementById("jobs");
    const peerSelect = document.getElementById("peer-id");
    const signalEl = document.getElementById("signal");
    const socketLabelEl = document.getElementById("socket-label");
    const toastEl = document.getElementById("toasts");

    const esc = (value) => String(value ?? "").replace(/[&<>'"]/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;"
    })[character]);

    const shortId = (value) => value ? String(value).slice(0, 8) : "--------";

    function bytes(value) {
      const number = Number(value || 0);
      if (!Number.isFinite(number) || number <= 0) return "0 B";
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      const index = Math.min(Math.floor(Math.log(number) / Math.log(1024)), units.length - 1);
      const scaled = number / Math.pow(1024, index);
      return `${scaled.toFixed(index === 0 ? 0 : scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2)} ${units[index]}`;
    }

    function eta(seconds) {
      if (seconds == null || !Number.isFinite(Number(seconds))) return "--";
      const total = Math.max(0, Math.round(Number(seconds)));
      if (total < 60) return `${total}s`;
      if (total < 3600) return `${Math.floor(total / 60)}m ${total % 60}s`;
      return `${Math.floor(total / 3600)}h ${Math.floor((total % 3600) / 60)}m`;
    }

    function age(timestamp) {
      if (!timestamp) return "unknown";
      const delta = Math.max(0, Date.now() - Number(timestamp));
      if (delta < 5000) return "just now";
      if (delta < 60000) return `${Math.floor(delta / 1000)}s ago`;
      if (delta < 3600000) return `${Math.floor(delta / 60000)}m ago`;
      if (delta < 86400000) return `${Math.floor(delta / 3600000)}h ago`;
      return new Date(Number(timestamp)).toLocaleString();
    }

    function label(value) {
      return String(value || "unknown").replaceAll("_", " ");
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try {
          const body = await response.json();
          message = body?.error?.message || message;
        } catch (_) {}
        throw new Error(message);
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function toast(message, kind = "error") {
      const item = document.createElement("div");
      item.className = `toast ${kind === "ok" ? "ok" : ""}`;
      item.textContent = message;
      toastEl.appendChild(item);
      window.setTimeout(() => item.remove(), 5000);
    }

    async function refreshAll() {
      try {
        const [local, devices, jobs] = await Promise.all([
          request("/api/local"), request("/api/devices"), request("/api/jobs")
        ]);
        app.local = local;
        app.devices = devices;
        app.jobs = jobs;
        render();
      } catch (error) {
        toast(`Refresh failed: ${error.message}`);
      }
    }

    function scheduleRefresh() {
      window.clearTimeout(app.refreshTimer);
      app.refreshTimer = window.setTimeout(refreshAll, 120);
    }

    function render() {
      renderIdentity();
      renderDevices();
      renderPeerOptions();
      renderJobs();
    }

    function renderIdentity() {
      if (!app.local) return;
      identityEl.innerHTML = `
        <div class="identity-cell">
          <span class="micro">Local node</span>
          <div class="identity-value identity-name">${esc(app.local.name)}</div>
        </div>
        <div class="identity-cell">
          <span class="micro">Device identity</span>
          <div class="identity-value" title="${esc(app.local.id)}">${esc(shortId(app.local.id))} / PK ${esc(String(app.local.public_key).slice(0, 10))}</div>
        </div>
        <div class="identity-cell">
          <span class="micro">QUIC endpoint</span>
          <div class="identity-value">${esc(app.local.quic_address)}</div>
        </div>
        <div class="identity-cell">
          <span class="micro">Protocol</span>
          <div class="identity-value">V${esc(app.local.protocol_version)} / agent ${esc(app.local.agent_version)}</div>
        </div>`;
    }

    function renderDevices() {
      document.getElementById("device-count").textContent = String(app.devices.length).padStart(2, "0");
      if (!app.devices.length) {
        devicesEl.innerHTML = `<div class="empty">No peers observed. Enter an address or wait for discovery.</div>`;
        return;
      }
      devicesEl.innerHTML = app.devices.map((device) => `
        <article class="device">
          <div class="device-top">
            <div class="device-title">
              <h3 class="device-name" title="${esc(device.name)}">${esc(device.name)}</h3>
              <div class="device-address">${esc(device.address)}</div>
            </div>
            <span class="badge ${device.online ? "online" : "offline"}">${device.online ? "online" : "offline"}</span>
          </div>
          <div class="device-meta">
            <span class="badge ${device.trusted ? "trusted" : "pending"}">${device.trusted ? "trusted" : "pending"}</span>
            <span class="badge ${device.identity_verified ? "trusted" : "offline"}">${device.identity_verified ? "key verified" : "beacon only"}</span>
          </div>
          <div class="device-address" title="${esc(device.id)}">ID ${esc(shortId(device.id))} &middot; seen ${esc(age(device.last_seen))}</div>
          <div class="device-actions">
            ${device.trusted
              ? `<button class="quiet danger" data-device-action="untrust" data-id="${esc(device.id)}">Untrust</button>`
              : `<button class="quiet" data-device-action="trust" data-id="${esc(device.id)}">Pair / Trust</button>`}
          </div>
        </article>`).join("");
    }

    function renderPeerOptions() {
      const previous = peerSelect.value;
      const trusted = app.devices.filter((device) => device.trusted);
      peerSelect.innerHTML = trusted.length
        ? `<option value="">Select a trusted peer</option>${trusted.map((device) => `<option value="${esc(device.id)}">${esc(device.name)}${device.online ? " / online" : " / offline"}</option>`).join("")}`
        : `<option value="">No trusted peers</option>`;
      if (trusted.some((device) => device.id === previous)) peerSelect.value = previous;
      document.getElementById("start-transfer").disabled = !trusted.length;
    }

    function renderJobs() {
      document.getElementById("job-count").textContent = String(app.jobs.length).padStart(2, "0");
      if (!app.jobs.length) {
        jobsEl.innerHTML = `<div class="empty">No transfer records. Dispatch a directory to begin.</div>`;
        return;
      }
      jobsEl.innerHTML = app.jobs.map(jobCard).join("");
    }

    function jobCard(job) {
      const progress = job.progress || {};
      const pipeline = job.pipeline || {};
      const status = String(job.status || "unknown");
      const controllable = job.direction === "outgoing";
      const active = controllable && job.runner_active && ["pending", "scanning", "transferring", "verifying"].includes(status);
      const paused = controllable && status === "paused";
      const resumable = paused || (controllable && !job.runner_active && ["pending", "interrupted", "failed", "completed_with_errors"].includes(status));
      const cancellable = controllable && (active || paused || status === "interrupted");
      const errors = [
        ...(job.error ? [{ path: "job", operation: "runtime", message: job.error }] : []),
        ...(job.errors || []),
        ...(job.file_errors || []).map((item) => ({ path: item.path, operation: item.status, message: item.message }))
      ];
      const source = job.direction === "incoming" ? `peer ${shortId(job.peer_id)}` : job.source_path;
      const percent = Math.max(0, Math.min(100, Number(job.percent || 0)));
      const current = progress.current_file;
      return `
        <article class="job">
          <div class="job-main">
            <div class="job-head">
              <div>
                <h3 class="job-route" title="${esc(source)} -> ${esc(job.destination_path)}"><strong>${esc(source)}</strong> -&gt; ${esc(job.destination_path)}</h3>
                <div class="job-id">${esc(job.direction)} / ${esc(job.id)} / ${esc(job.verification)}</div>
              </div>
              <span class="badge ${esc(status)}">${esc(label(status))}</span>
            </div>
            <div class="progress-track" role="progressbar" aria-label="Transfer progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent.toFixed(1)}">
              <div class="progress-fill" style="width:${percent.toFixed(2)}%"></div>
            </div>
            <div class="progress-caption">
              <span><strong>${percent.toFixed(1)}%</strong> &middot; ${esc(bytes(job.accounted_bytes))} / ${esc(bytes(progress.total_bytes))}</span>
              <span>${esc(job.throughput_mbps.toFixed(2))} Mbps &middot; ${esc(job.throughput_megabytes_per_second.toFixed(2))} MB/s</span>
            </div>
            <div class="metric-grid">
              <div class="metric hot"><div class="metric-value">${esc(job.throughput_megabytes_per_second.toFixed(2))}</div><div class="metric-label">MB/s current</div></div>
              <div class="metric"><div class="metric-value">${esc(progress.completed_files || 0)} / ${esc(progress.total_files || 0)}</div><div class="metric-label">Files complete</div></div>
              <div class="metric"><div class="metric-value">${esc(progress.transferred_files || 0)} / ${esc(progress.skipped_files || 0)}</div><div class="metric-label">Sent / skipped</div></div>
              <div class="metric"><div class="metric-value">${esc(progress.failed_files || 0)}</div><div class="metric-label">Failed files</div></div>
              <div class="metric"><div class="metric-value">${esc(bytes(progress.reused_bytes))}</div><div class="metric-label">Reused bytes</div></div>
              <div class="metric"><div class="metric-value">${esc(eta(job.eta_seconds))}</div><div class="metric-label">ETA</div></div>
            </div>
            <div class="pipeline">
              <span>File streams <b>${esc(pipeline.active_file_streams || 0)}</b></span>
              <span>Chunk streams <b>${esc(pipeline.active_chunk_streams || 0)}</b></span>
              <span>Queue <b>${esc(pipeline.queued_chunks || 0)}</b></span>
              <span>Concurrency <b>${esc(pipeline.current_concurrency || 0)} / ${esc(pipeline.configured_concurrency || job.concurrency || 0)}</b></span>
              <span>Read <b>${esc(bytes(progress.read_bytes_per_second || 0))}/s</b></span>
              <span>Write ACK <b>${esc(bytes(progress.write_bytes_per_second || 0))}/s</b></span>
              <span>Hash <b>${esc(bytes(progress.hash_bytes_per_second || 0))}/s</b></span>
              ${current ? `<span class="current-file" title="${esc(current.relative_path)}">Current <b>${esc(current.relative_path)}</b></span>` : ""}
            </div>
            ${errors.length ? `
              <details class="errors">
                <summary>${errors.length} recorded error${errors.length === 1 ? "" : "s"}</summary>
                <ul class="error-list">${errors.map((error) => `<li><b>${esc(error.path || error.relative_path || "job")}</b> / ${esc(error.operation || "error")}: ${esc(error.message)}</li>`).join("")}</ul>
              </details>` : ""}
          </div>
          <footer class="job-footer">
            <div class="job-actions">
              ${active ? `<button class="quiet" data-job-action="pause" data-id="${esc(job.id)}">Pause</button>` : ""}
              ${resumable ? `<button class="quiet" data-job-action="resume" data-id="${esc(job.id)}">Resume</button>` : ""}
              ${cancellable ? `<button class="quiet danger" data-job-action="cancel" data-id="${esc(job.id)}">Cancel</button>` : ""}
            </div>
            <span class="job-time">updated ${esc(age(job.updated_at))}</span>
          </footer>
        </article>`;
    }

    document.getElementById("connect-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const address = new FormData(form).get("address");
        const device = await request("/api/devices/connect", {
          method: "POST", body: JSON.stringify({ address })
        });
        toast(`Authenticated ${device.name}. Confirm trust from its peer card.`, "ok");
        form.reset();
        await refreshAll();
      } catch (error) {
        toast(`Probe failed: ${error.message}`);
      } finally {
        button.disabled = false;
      }
    });

    devicesEl.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-device-action]");
      if (!button) return;
      button.disabled = true;
      const id = button.dataset.id;
      const action = button.dataset.deviceAction;
      try {
        if (action === "trust") {
          const device = await request(`/api/devices/${encodeURIComponent(id)}/trust`, { method: "POST", body: "{}" });
          toast(`${device.name} is trusted.`, "ok");
        } else {
          await request(`/api/devices/${encodeURIComponent(id)}/trust`, { method: "DELETE" });
          toast("Peer trust removed.", "ok");
        }
        await refreshAll();
      } catch (error) {
        toast(`${action === "trust" ? "Pairing" : "Untrust"} failed: ${error.message}`);
        button.disabled = false;
      }
    });

    document.getElementById("transfer-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = document.getElementById("start-transfer");
      button.disabled = true;
      const data = new FormData(form);
      const payload = {
        peer_id: data.get("peer_id"),
        source_path: data.get("source_path"),
        destination_path: data.get("destination_path"),
        verification: data.get("verification"),
        concurrency: Number(data.get("concurrency")),
        chunk_size_mib: Number(data.get("chunk_size_mib"))
      };
      try {
        const job = await request("/api/jobs", { method: "POST", body: JSON.stringify(payload) });
        toast(`Transfer ${shortId(job.id)} dispatched.`, "ok");
        await refreshAll();
      } catch (error) {
        toast(`Transfer could not start: ${error.message}`);
      } finally {
        button.disabled = !app.devices.some((device) => device.trusted);
      }
    });

    jobsEl.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-job-action]");
      if (!button) return;
      button.disabled = true;
      const action = button.dataset.jobAction;
      const id = button.dataset.id;
      try {
        await request(`/api/jobs/${encodeURIComponent(id)}/${action}`, { method: "POST", body: "{}" });
        await refreshAll();
      } catch (error) {
        toast(`${label(action)} failed: ${error.message}`);
        button.disabled = false;
      }
    });

    function connectEvents() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/api/events`);
      app.socket = socket;
      socket.addEventListener("open", () => {
        app.reconnectDelay = 800;
        signalEl.classList.add("live");
        socketLabelEl.textContent = "event link live";
      });
      socket.addEventListener("message", scheduleRefresh);
      socket.addEventListener("close", () => {
        signalEl.classList.remove("live");
        socketLabelEl.textContent = "event link retry";
        const delay = app.reconnectDelay;
        app.reconnectDelay = Math.min(app.reconnectDelay * 1.7, 12000);
        window.setTimeout(connectEvents, delay);
      });
      socket.addEventListener("error", () => socket.close());
    }

    refreshAll();
    connectEvents();
    window.setInterval(refreshAll, 10000);
  </script>
</body>
</html>
