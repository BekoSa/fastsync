name: Apply active file metric implementation

on:
  push:
    branches:
      - fix/active-file-stream-metric

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-file-stream-metric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact active-file tracking changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/fastsync-transfer/src/sender.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "use dashmap::DashSet;\n",
                  "use dashmap::{DashMap, DashSet, mapref::entry::Entry};\n",
              ),
              (
                  '''#[derive(Clone)]\nstruct UploadWork {\n    file: Arc<HashedFile>,\n    chunk: ChunkDescriptor,\n}\n''',
                  '''#[derive(Clone)]\nstruct UploadWork {\n    file: Arc<HashedFile>,\n    chunk: ChunkDescriptor,\n}\n\n#[derive(Clone, Default)]\nstruct ActiveFileTracker {\n    counts: Arc<DashMap<String, usize>>,\n}\n\nimpl ActiveFileTracker {\n    fn enter(&self, path: &str) -> ActiveFileGuard {\n        match self.counts.entry(path.to_owned()) {\n            Entry::Occupied(mut count) => {\n                let next = count.get().saturating_add(1);\n                *count.get_mut() = next;\n            }\n            Entry::Vacant(entry) => {\n                entry.insert(1);\n            }\n        }\n        ActiveFileGuard {\n            tracker: self.clone(),\n            path: path.to_owned(),\n        }\n    }\n\n    fn active_files(&self) -> u32 {\n        u32::try_from(self.counts.len()).unwrap_or(u32::MAX)\n    }\n}\n\nstruct ActiveFileGuard {\n    tracker: ActiveFileTracker,\n    path: String,\n}\n\nimpl Drop for ActiveFileGuard {\n    fn drop(&mut self) {\n        match self.tracker.counts.entry(self.path.clone()) {\n            Entry::Occupied(mut count) if *count.get() > 1 => {\n                *count.get_mut() -= 1;\n            }\n            Entry::Occupied(count) => {\n                count.remove();\n            }\n            Entry::Vacant(_) => {}\n        }\n    }\n}\n''',
              ),
              (
                  '''        let initial_active = job\n            .progress\n            .queued_chunks\n            .min(u64::from(job.config.concurrency));\n        job.progress.active_chunk_streams = u32::try_from(initial_active).unwrap_or(u32::MAX);\n        job.progress.active_file_streams = job.progress.active_chunk_streams;\n        self.persist_job(job, progress)?;\n        let work = stream::iter(upload_work(files, plans).map(|(path, work)| {\n''',
                  '''        let initial_active = job\n            .progress\n            .queued_chunks\n            .min(u64::from(job.config.concurrency));\n        let initial_active_files = upload_work(files, plans)\n            .take(concurrency)\n            .map(|(path, _)| path)\n            .collect::<HashSet<_>>()\n            .len();\n        job.progress.active_chunk_streams = u32::try_from(initial_active).unwrap_or(u32::MAX);\n        job.progress.active_file_streams =\n            u32::try_from(initial_active_files).unwrap_or(u32::MAX);\n        self.persist_job(job, progress)?;\n        let active_files = ActiveFileTracker::default();\n        let work = stream::iter(upload_work(files, plans).map(|(path, work)| {\n''',
              ),
              (
                  '''            let source_root = source_root.clone();\n            let terminal_paths = Arc::clone(&terminal_paths);\n            let file_size = work.as_ref().map_or(0, |work| work.file.entry.size);\n''',
                  '''            let source_root = source_root.clone();\n            let terminal_paths = Arc::clone(&terminal_paths);\n            let active_files = active_files.clone();\n            let file_size = work.as_ref().map_or(0, |work| work.file.entry.size);\n''',
              ),
              (
                  '''            let chunk_size = work.as_ref().map_or(0, |work| work.chunk.size);\n            async move {\n                let result = async {\n''',
                  '''            let chunk_size = work.as_ref().map_or(0, |work| work.chunk.size);\n            async move {\n                let _active_file = active_files.enter(&path);\n                let result = async {\n''',
              ),
              (
                  '''            job.progress.active_chunk_streams = u32::try_from(active).unwrap_or(u32::MAX);\n            job.progress.active_file_streams = job.progress.active_chunk_streams;\n            job.progress.current_file = Some(FileProgress {\n''',
                  '''            job.progress.active_chunk_streams = u32::try_from(active).unwrap_or(u32::MAX);\n            job.progress.active_file_streams = active_files.active_files();\n            job.progress.current_file = Some(FileProgress {\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected snippet exactly once, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Run focused regression test
        run: cargo test -p fastsync-transfer active_file_tracker_counts_unique_paths

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fastsync-transfer/src/sender.rs
          git diff --cached --check
          git commit -m "fix(transfer): report unique active file streams"
          git push origin HEAD:fix/active-file-stream-metric
