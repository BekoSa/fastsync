name: Apply Rust 1.98 cleanup

on:
  push:
    branches:
      - fix/rust-1.98-quality

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rust-1.98-quality
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact Clippy cleanups
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("crates/fastsync-transfer/src/auth.rs"): [
                  (
                      '''        if let Some(expected) = expected_device_id {\n            if server.device_id != expected {\n                return Err(TransferError::Authentication(format!(\n                    "connected to device {}, expected {expected}",\n                    server.device_id\n                )));\n            }\n        }\n''',
                      '''        if let Some(expected) = expected_device_id\n            && server.device_id != expected\n        {\n            return Err(TransferError::Authentication(format!(\n                "connected to device {}, expected {expected}",\n                server.device_id\n            )));\n        }\n''',
                  ),
              ],
              Path("crates/fastsync-transfer/src/receiver.rs"): [
                  (
                      '''                if let Err(error) = engine\n                    .handle_incoming_connection(incoming, connection_cancellation)\n                    .await\n                {\n                    if !matches!(error, TransferError::Cancelled) {\n                        tracing::debug!(%error, "FastSync QUIC connection ended");\n                    }\n                }\n''',
                      '''                if let Err(error) = engine\n                    .handle_incoming_connection(incoming, connection_cancellation)\n                    .await\n                    && !matches!(error, TransferError::Cancelled)\n                {\n                    tracing::debug!(%error, "FastSync QUIC connection ended");\n                }\n''',
                  ),
                  (
                      '''        if let Some(actual) = &actual {\n            if actual.file_type != FileType::File {\n                return Err(TransferError::InvalidData(format!(\n                    "destination `{}` is not a regular file",\n                    destination.display()\n                )));\n            }\n        }\n''',
                      '''        if let Some(actual) = &actual\n            && actual.file_type != FileType::File\n        {\n            return Err(TransferError::InvalidData(format!(\n                "destination `{}` is not a regular file",\n                destination.display()\n            )));\n        }\n''',
                  ),
                  (
                      '''        let metadata = fs::symlink_metadata(&partial)\n            .await\n            .map_err(|error| TransferError::io("checking partial file", &partial, error))?;\n''',
                      '''        let metadata = fs::symlink_metadata(partial)\n            .await\n            .map_err(|error| TransferError::io("checking partial file", partial, error))?;\n''',
                  ),
              ],
              Path("crates/fastsync-transfer/src/state.rs"): [
                  (
                      '''        if entry.file_type == fastsync_core::FileType::File {\n            if active.required_directories.contains(path) {\n                return Err(TransferError::InvalidData(format!(\n                    "manifest file {path:?} is an ancestor of another path"\n                )));\n            }\n        }\n''',
                      '''        if entry.file_type == fastsync_core::FileType::File\n            && active.required_directories.contains(path)\n        {\n            return Err(TransferError::InvalidData(format!(\n                "manifest file {path:?} is an ancestor of another path"\n            )));\n        }\n''',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected old snippet exactly once, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fastsync-transfer/src/auth.rs crates/fastsync-transfer/src/receiver.rs crates/fastsync-transfer/src/state.rs
          git diff --cached --check
          git commit -m "fix(transfer): satisfy Rust 1.98 Clippy"
          git push origin HEAD:fix/rust-1.98-quality
