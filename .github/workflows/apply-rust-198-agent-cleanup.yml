name: Apply final Rust 1.98 agent cleanup

on:
  push:
    branches:
      - fix/rust-1.98-quality

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rust-1.98-quality
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact agent Clippy cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/fastsync-agent/src/jobs.rs")
          text = path.read_text(encoding="utf-8")
          old = '''                        if *control.pause.borrow() {\n                            if let Err(error) = self.inner.database.update_job_status(\n                                job_id,\n                                JobStatus::Paused,\n                            ) {\n                                tracing::warn!(%job_id, %error, "failed to persist paused status");\n                            }\n                        }\n'''
          new = '''                        if *control.pause.borrow()\n                            && let Err(error) = self\n                                .inner\n                                .database\n                                .update_job_status(job_id, JobStatus::Paused)\n                        {\n                            tracing::warn!(%job_id, %error, "failed to persist paused status");\n                        }\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected old snippet exactly once, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fastsync-agent/src/jobs.rs
          git diff --cached --check
          git commit -m "fix(agent): satisfy Rust 1.98 Clippy"
          git push origin HEAD:fix/rust-1.98-quality
