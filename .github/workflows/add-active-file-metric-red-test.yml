name: Add active file metric RED test

on:
  push:
    branches:
      - fix/active-file-stream-metric

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-file-stream-metric
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Append regression test only
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/fastsync-transfer/src/sender.rs")
          text = path.read_text(encoding="utf-8")
          marker = '''fn publish_progress(sender: Option<&watch::Sender<TransferProgress>>, progress: &TransferProgress) {\n    if let Some(sender) = sender {\n        sender.send_replace(progress.clone());\n    }\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"expected publish_progress marker once, found {text.count(marker)}")
          test = '''\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn active_file_tracker_counts_unique_paths() {\n        let tracker = ActiveFileTracker::default();\n        assert_eq!(tracker.active_files(), 0);\n\n        let first_a = tracker.enter("a.bin");\n        assert_eq!(tracker.active_files(), 1);\n        let second_a = tracker.enter("a.bin");\n        assert_eq!(tracker.active_files(), 1);\n\n        let b = tracker.enter("b.bin");\n        assert_eq!(tracker.active_files(), 2);\n\n        drop(first_a);\n        assert_eq!(tracker.active_files(), 2);\n        drop(second_a);\n        assert_eq!(tracker.active_files(), 1);\n        drop(b);\n        assert_eq!(tracker.active_files(), 0);\n    }\n}\n'''
          path.write_text(text.replace(marker, marker + test, 1), encoding="utf-8")

      - name: Format
        run: cargo fmt --all

      - name: Commit RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/fastsync-transfer/src/sender.rs
          git diff --cached --check
          git commit -m "test(transfer): cover unique active file streams"
          git push origin HEAD:fix/active-file-stream-metric
